<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Câmera dos dados</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
      #aviso {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: 24rem;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #aviso[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <p id="aviso" hidden></p>
    <script type="module" src="camera.js"></script>
  </body>
</html>
